<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Are — Seguimiento semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,400..600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1929;--bg2:#112240;--bg3:#1a3355;
  --border:rgba(255,255,255,0.18);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f0;--text2:#8892a4;--text3:#3d4f6b;
  --orange:#f04e23;--orange2:#d43d16;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#7a9eca;
  --font:'Montserrat',system-ui,'Segoe UI',sans-serif;
  --mono:'Montserrat',system-ui,'Segoe UI',sans-serif;
  --code:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:13.5px;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
button,input,select,textarea{font-family:inherit}

/* ===== top bar ===== */
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;min-height:56px;
  border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:200;flex-wrap:wrap}
.top-left,.top-right{display:flex;align-items:center;gap:10px;padding:8px 0}
.iso{height:26px;width:auto;display:block;flex:none}
.text-logo-sm{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.logo-we{color:#f0f0f0}.logo-are{color:var(--orange)}
.top-divider{width:1px;height:20px;background:var(--border2)}
.top-sub{font-size:12px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
/* ===== login ===== */
.auth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px}
.auth.on{display:flex}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:36px 34px;width:100%;max-width:380px}
.auth-iso{height:44px;display:block;margin:0 auto 14px}
.auth-logo{font-size:26px;font-weight:800;letter-spacing:-.03em;text-align:center;margin-bottom:4px}
.auth-t{font-size:13px;color:var(--text2);text-align:center;margin-bottom:22px}
.auth .fld{margin-bottom:12px}
.auth .inp{padding:11px 13px}
.auth-btn{width:100%;font-size:14px;font-weight:700;padding:12px;background:var(--orange);color:#fff;border:none;
  border-radius:var(--radius);cursor:pointer;margin-top:6px}
.auth-btn:hover{background:var(--orange2)}
.auth-btn:disabled{opacity:.5;cursor:default}
.auth-err{font-size:12px;color:#ef6b6b;text-align:center;margin-top:12px;min-height:17px;line-height:1.45}
.auth-pie{font-size:11px;color:var(--text3);text-align:center;margin-top:16px;line-height:1.5}
.app-shell{display:none}
.app-shell.on{display:block}

/* ===== estado de guardado ===== */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;
  white-space:nowrap;border:1px solid transparent}
.sync i{width:7px;height:7px;border-radius:50%;display:block;flex:none}
.sync.ok{color:var(--text3)}
.sync.ok i{background:var(--green)}
.sync.va{color:var(--text3)}
.sync.va i{background:var(--amber);animation:lat 1s ease-in-out infinite}
.sync.mal{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.4);color:#ef6b6b;cursor:pointer}
.sync.mal i{background:var(--red)}
.sync.choque{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.4);color:var(--amber);cursor:pointer}
.sync.choque i{background:var(--amber)}
@keyframes lat{0%,100%{opacity:.35}50%{opacity:1}}
.user-pill{font-size:11px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);padding:5px 11px;border-radius:20px;white-space:nowrap}

.buscador{width:210px;font-size:12px;padding:7px 12px;border-radius:20px}
@media(max-width:1200px){.buscador{width:150px}}
.bk{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;padding:5px 6px 5px 12px;border-radius:20px;white-space:nowrap}
.bk.warn{background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.35);color:var(--amber)}
.bk.bad{background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.4);color:#ef6b6b}
.bk button{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:none;cursor:pointer;
  background:rgba(255,255,255,.1);color:inherit}
.bk button:hover{background:rgba(255,255,255,.2)}

/* ===== week nav ===== */
.wknav{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:3px}
.wknav button{width:28px;height:28px;border:none;background:transparent;color:var(--text2);font-size:15px;cursor:pointer;border-radius:50%;line-height:1}
.wknav button:hover:not(:disabled){background:var(--bg3);color:var(--orange)}
.wknav button:disabled{opacity:.25;cursor:default}
.wklabel{font-family:var(--mono);font-size:12px;font-weight:500;padding:2px 10px;min-width:180px;text-align:center;white-space:nowrap;cursor:pointer;border:none;background:transparent;color:var(--text)}
.wklabel b{color:var(--orange);font-weight:700}
.wklabel small{display:block;font-size:9px;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;font-family:var(--font);font-weight:700;margin-top:1px}

.btn-sm{font-size:12px;padding:6px 13px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn-sm:hover{color:var(--orange);border-color:var(--orange)}
.btn-orange{font-size:12px;font-weight:600;padding:7px 15px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;white-space:nowrap}
.btn-orange:hover{background:var(--orange2)}
.btn-ghost{font-size:11px;padding:4px 9px;background:transparent;color:var(--text3);border:1px dashed var(--border2);border-radius:8px;cursor:pointer}
.btn-ghost:hover{color:var(--orange);border-color:var(--orange)}
.btn-danger{font-size:12px;padding:6px 13px;background:transparent;color:#b4576b;border:1px solid rgba(239,68,68,.35);border-radius:var(--radius);cursor:pointer}
.btn-danger:hover{background:rgba(239,68,68,.12);color:var(--red)}

/* ===== shell ===== */
.main{padding:18px 22px 80px;max-width:1560px;width:100%;margin:0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{font-size:13px;font-weight:500;padding:8px 17px;background:transparent;color:var(--text2);border:1px solid var(--border2);
  border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--orange);color:var(--text)}
.tab.active{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
.tab-count{font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:20px}
.tab.active .tab-count{background:rgba(0,0,0,.25)}
.tab-count.warn{background:var(--red);color:#fff}
.pane{display:none}.pane.active{display:block}

/* ===== banner ===== */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(240,78,35,.08);border:1px solid rgba(240,78,35,.3);
  border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--text2)}
.banner b{color:var(--text)}
.spacer{flex:1}

/* ===== kpis ===== */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--text3);border-radius:var(--radius-lg);padding:13px 16px}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:5px}
.kpi.ok{border-top-color:var(--green)}.kpi.bad{border-top-color:var(--red)}
.kpi.warn{border-top-color:var(--amber)}.kpi.acc{border-top-color:var(--orange)}

/* ===== sections ===== */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}
.section-body{padding:14px 18px}
.section-body.tight{padding:0}
.hint{font-size:11px;color:var(--text3);line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* ===== semáforo chips ===== */
.sem{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;padding:5px 10px;font-size:10.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;min-width:78px;user-select:none;white-space:nowrap}
.sem:hover{outline:1px solid rgba(255,255,255,.45)}
.sem-verde{background:#16a34a;color:#fff}
.sem-amarillo{background:#f59e0b;color:#3b2300}
.sem-rojo{background:#dc2626;color:#fff}
.sem-null{background:transparent;color:var(--text3);border:1px dashed var(--text3);font-weight:600;text-transform:none;letter-spacing:0}
.sem.sm{min-width:0;padding:3px 9px;font-size:9.5px}
.sem.ro{cursor:default}
.sem.ro:hover{outline:none}
.sem:focus{outline:2px solid #fff;outline-offset:2px}
.sem:focus-visible{outline:2px solid #fff;outline-offset:2px}
.teclas{display:inline-flex;gap:0;align-items:center}
.teclas b{color:var(--text2);font-family:var(--mono);background:rgba(255,255,255,.07);border:1px solid var(--border2);
  border-radius:4px;padding:1px 5px;margin:0 2px;font-size:10px}
.av-box{display:inline-flex;align-items:baseline;gap:3px}
.av-num{width:44px;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--text);
  font-family:var(--mono);font-size:13px;font-weight:700;text-align:right;padding:1px 3px;outline:none;
  -moz-appearance:textfield}
.av-num::-webkit-outer-spin-button,.av-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.av-num:hover{border-color:var(--border2)}
.av-num:focus{border-color:var(--orange);background:var(--bg3)}
.av-pc{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text3)}

/* ===== fila editable ===== */
.item{border-bottom:1px solid rgba(255,255,255,.06);padding:13px 18px}
.item:last-child{border-bottom:none}
.item-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.item-name{font-size:14px;font-weight:600;line-height:1.3;flex:1;min-width:180px}
.item-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}
.pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:20px;
  background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border2);white-space:nowrap}
.pill.rock{background:rgba(240,78,35,.15);color:#f4795a;border-color:rgba(240,78,35,.3)}
.pill.proyecto{background:rgba(122,158,202,.14);color:var(--blue);border-color:rgba(122,158,202,.3)}
.pill.tarea{background:rgba(255,255,255,.05);color:var(--text2)}
.pill.late{background:rgba(239,68,68,.14);color:#ef6b6b;border-color:rgba(239,68,68,.35)}
.item-body{display:grid;grid-template-columns:220px 1fr;gap:14px;margin-top:11px;align-items:start}
@media(max-width:760px){.item-body{grid-template-columns:1fr}}

/* ===== avance ===== */
.avance{display:flex;flex-direction:column;gap:5px}
.avance-top{display:flex;justify-content:space-between;align-items:baseline}
.avance-lbl{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.avance-val{font-family:var(--mono);font-size:13px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;background:var(--bg3);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--orange);border:2px solid var(--bg2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--orange);border:2px solid var(--bg2);cursor:pointer}
.bar{height:6px;border-radius:4px;background:var(--bg3);overflow:hidden;min-width:52px}
.bar>span{display:block;height:100%;background:var(--orange);border-radius:4px}
.delta{font-family:var(--mono);font-size:10.5px;font-weight:700}
.delta.up{color:var(--green)}.delta.flat{color:var(--text3)}.delta.down{color:var(--red)}

/* ===== inputs ===== */
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.fld:last-child{margin-bottom:0}
.fld label{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.inp,textarea.inp,select.inp{font-size:13px;padding:8px 11px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:8px;outline:none;width:100%;line-height:1.45}
.inp:focus{border-color:var(--orange)}
.inp::placeholder{color:var(--text3)}
textarea.inp{resize:vertical;min-height:40px}
select.inp{cursor:pointer}
/* ===== editor de notas con formato ===== */
.rich{position:relative}
.rich-body{min-height:46px;padding:9px 12px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);
  border-radius:8px;font-size:13px;line-height:1.6;outline:none;overflow-wrap:anywhere;white-space:pre-wrap}
.rich-body:focus{border-color:var(--orange);background:#16304f}
.rich-body:empty::before{content:attr(data-ph);color:var(--text3);pointer-events:none}
.rich-body b,.rich-body strong{font-weight:700;color:#fff}
.rich-body ul{margin:2px 0 2px 18px}
.rich-body li{margin:1px 0}
.rich-tools{display:none;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center}
.rich:focus-within .rich-tools{display:flex}
.rich-tools button{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;
  min-width:26px;height:24px;font-size:12px;line-height:1;cursor:pointer;padding:0 6px}
.rich-tools button:hover{border-color:var(--orange);color:var(--orange)}
.rich-tools .sw{padding:0;width:22px;min-width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.28)}
.rich-tools .sw:hover{outline:1px solid #fff}
.tools-sep{width:1px;height:16px;background:var(--border2);margin:0 3px}

.prev-note{font-size:11.5px;color:var(--text3);line-height:1.5;margin-top:6px;padding-left:9px;border-left:2px solid var(--border2)}
.prev-note b{color:var(--text2);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.07em;display:block;margin-bottom:2px}

/* ===== descripción fija + historial de reunión ===== */
.desc-txt{font-size:12.5px;color:var(--text2);line-height:1.5;margin-top:6px;max-width:760px}
.desc-txt .mini{vertical-align:baseline;margin-left:4px}
.reunion-box{margin-top:12px;background:rgba(240,78,35,.05);border:1px solid rgba(240,78,35,.22);border-radius:var(--radius);padding:11px 13px}
.reunion-box label{font-size:9.5px;font-weight:700;color:#f4795a;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px}
.hist{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.hist-i{font-size:11.5px;color:var(--text3);line-height:1.5;padding-left:9px;border-left:2px solid var(--border2)}
.hist-i b{color:var(--text2);font-family:var(--mono);font-size:10px;font-weight:700;display:block;margin-bottom:1px}
.hist-more{font-size:10.5px;color:var(--text3);font-style:italic}
/* ===== casilla propia (la nativa se ve horrible en Windows) ===== */
.chk{appearance:none;-webkit-appearance:none;flex:none;width:19px;height:19px;border-radius:6px;cursor:pointer;
  border:1.5px solid var(--text3);background:var(--bg3);position:relative;margin:0;transition:background .12s,border-color .12s}
.chk:hover{border-color:var(--orange)}
.chk::after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) scale(.4);opacity:0;transition:opacity .12s,transform .12s}
.chk:checked{background:var(--orange);border-color:var(--orange)}
.chk:checked::after{opacity:1;transform:rotate(45deg) scale(1)}
.chk:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ===== fila de tarea: lista, no formulario =====
   Los campos son inputs pero se ven como texto hasta que los tocás. El estado
   lo carga el borde izquierdo y la fecha, que se lee en palabras. Todo lo
   secundario (nota, marca, tipo, borrar) vive detrás de un solo desplegable. */
/* Las filas llevan su propio velo translúcido para despegarse apenas del
   panel: suficiente para que se lean como bloque, no tanto como para competir
   con la banda del grupo. */
.tr{display:flex;align-items:flex-start;gap:11px;padding:10px 18px 10px 15px;border-left:3px solid transparent;
  border-bottom:1px solid rgba(255,255,255,.05);position:relative;background:rgba(255,255,255,.035)}
.tr:last-child{border-bottom:none}
.tr:hover{background:rgba(255,255,255,.07)}
.tr.venc{border-left-color:var(--red)}
.tr.hoy{border-left-color:var(--orange)}
.tr.list{opacity:.45}
.tr-mid{flex:1;min-width:0}
.tr-tit{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text);
  font-size:13.5px;font-weight:600;padding:4px 7px;outline:none;text-overflow:ellipsis}
.tr:hover .tr-tit{border-color:var(--border2)}
.tr-tit:focus{border-color:var(--orange);background:var(--bg3)}
.tr.list .tr-tit{text-decoration:line-through;color:var(--text2)}
.tr-nota{font-size:12px;color:var(--text3);line-height:1.5;padding:2px 7px 0;cursor:text;max-width:820px}
.tr-nota:hover{color:var(--text2)}
.tr-der{display:flex;align-items:center;gap:6px;flex:none;padding-top:3px}

/* fecha como palabra, no como campo */
/* El color vive en el texto y en un borde fino; el relleno se mantiene casi
   neutro para que la fila no se llene de manchas. */
.fch{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--border2);background:rgba(255,255,255,.035);color:var(--text2);min-width:78px;text-align:center;
  transition:border-color .12s,color .12s}
.fch:hover{border-color:rgba(255,255,255,.35);color:var(--text)}
.fch.roja{border-color:rgba(239,68,68,.5);color:#ff8f8f;background:rgba(239,68,68,.08)}
.fch.naranja{border-color:rgba(240,78,35,.55);color:#ffa584;background:rgba(240,78,35,.08)}
.fch.prox{color:var(--text);border-color:rgba(255,255,255,.2)}
.fch.vacia{border-style:dashed;border-color:rgba(255,255,255,.18);color:var(--text2);font-weight:600;background:none}
.fch.list{background:none;border-color:transparent;color:var(--text3);font-weight:600}
.fechas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 18px 12px 62px;background:rgba(0,0,0,.16)}
.fechas button{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;
  background:var(--bg3);color:var(--text2);border:1px solid var(--border2)}
.fechas button:hover{border-color:var(--orange);color:var(--orange)}
.fechas input[type=date]{font-size:11.5px;padding:5px 9px;background:var(--bg3);color:var(--text);
  border:1px solid var(--border2);border-radius:20px;outline:none}

/* acciones: aparecen al pasar por encima */
.tr-acc{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.tr:hover .tr-acc,.tr:focus-within .tr-acc,.tr-acc.fija{opacity:1}
.ico{background:none;border:1px solid transparent;border-radius:6px;color:var(--text3);cursor:pointer;

.ico.on{color:var(--orange);border-color:var(--border2)}

/* desplegable con todo lo secundario */

  display:flex;flex-direction:column;gap:11px}
.tr-det-fila{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tr-det-lbl{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;min-width:52px}

/* ===== mis tareas ===== */
/* ===== gráficos ===== */
.viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;padding:12px 18px 16px}

.viz{min-width:0}
.viz-hdr{margin-bottom:7px}
.viz-t{font-size:11.5px;font-weight:700;color:var(--text);letter-spacing:-.005em}
.viz-s{font-size:10.5px;color:var(--text3);margin-top:1px;line-height:1.35}
.viz svg{display:block;width:100%;height:auto;overflow:visible;max-height:220px}
.viz-legend{display:flex;gap:12px;flex-wrap:wrap;margin:5px 0 6px}
/* tiles compactos: adentro del resumen no compiten con los del 1:1 */
.kpi-row.compacta{grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:9px}
.compacta .kpi{padding:9px 12px;border-radius:var(--radius)}
.compacta .kpi-label{font-size:9px;margin-bottom:4px}
.compacta .kpi-val{font-size:19px}
.compacta .kpi-sub{font-size:10px;margin-top:3px}
.viz-key{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.viz-key i{width:10px;height:10px;border-radius:3px;display:block;flex:none}
.viz-empty{padding:28px 10px;text-align:center;color:var(--text3);font-size:12px;line-height:1.6;
  border:1px dashed var(--border2);border-radius:var(--radius)}
.viz-tip{position:fixed;z-index:950;background:#0b1929;border:1px solid var(--border);border-radius:8px;
  padding:7px 11px;font-size:11.5px;line-height:1.5;color:var(--text);pointer-events:none;opacity:0;
  transition:opacity .1s;box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:240px}
.viz-tip.on{opacity:1}
.viz-tip b{color:#fff}
.viz-tip .k{display:inline-flex;align-items:center;gap:5px}
.viz-tip .k i{width:8px;height:8px;border-radius:2px;display:inline-block}
.viz-tabla table{font-size:12px}
.viz-tabla td.n,.viz-tabla th.n{text-align:right;font-variant-numeric:tabular-nums}

.rec-ico{color:var(--orange);font-size:16px;line-height:1;flex:none}
/* Grafito neutro, no otro azul y no naranja: este encabezado se repite diez
   veces por página, así que tiene que separar sin pedir atención. Es gris de
   croma casi cero, así que contra el navy se lee como "otro material" y no
   como un azul lavado. El color queda para los estados de cada fila, que es
   lo único que de verdad tiene que saltar. */
/* Naranja translúcido al 55%: sigue leyéndose naranja (por debajo del 45% se
   mezcla con el navy y se va al marrón) pero baja bastante de intensidad
   contra el naranja pleno, que tapaba las tareas vencidas de abajo. */
.grp-marca{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;
  background:rgba(240,78,35,.55);
  border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(0,0,0,.28);
  box-shadow:inset 3px 0 0 var(--orange)}
.grp-marca .nm{font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fff;line-height:1.2}
/* Los contadores dejan de ser cápsulas: dos pastillas gordas por encabezado
   eran la mitad del ruido. Texto suelto, y el rojo solo donde hay algo vencido. */
/* Sobre la banda naranja, las cápsulas se apoyan en negro translúcido: el
   blanco sobre naranja se lee, un naranja claro sobre naranja no. */
.grp-marca .cnt{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:#fff;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.28);
  padding:3px 9px;border-radius:20px}
.grp-marca .cnt.venc{background:rgba(0,0,0,.42);border-color:rgba(255,255,255,.5)}
.grp-marca .grp-cel{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.72)}
/* Las de líder llevan la misma banda: el nombre del grupo ya las distingue. */
.grp-marca.sin{background:rgba(255,255,255,.07);box-shadow:inset 3px 0 0 var(--text3)}
.grp-marca.sin .cnt{background:rgba(0,0,0,.2);border-color:var(--border2);color:var(--text2)}
.grp-marca.sin .grp-cel{color:var(--text3)}
.grp-marca.sin .nm{color:rgba(255,255,255,.66);font-weight:600;font-size:13.5px}
.grp-cel{font-size:10.5px;color:var(--text3);font-weight:600}
.filtros-tar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
.flt-lbl{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.tipo-btn{flex:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 10px;
  border-radius:20px;cursor:pointer;background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border2)}
.tipo-btn:hover{border-color:var(--orange);color:var(--orange)}
.tipo-btn.lid{background:rgba(240,78,35,.14);color:#ffa584;border-color:rgba(240,78,35,.45)}


.add-ini{padding:14px 18px;background:rgba(0,0,0,.18);border-top:1px solid var(--border)}
.add-ini-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:9px}

/* ===== tablas ===== */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;text-align:left;

td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}

tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(255,255,255,.03)}
tr.open-row td{background:rgba(240,78,35,.05)}
td.cell{text-align:center;padding:6px 8px}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.muted{color:var(--text3)}
.caret{display:inline-block;width:14px;color:var(--text3);font-size:10px;transition:transform .15s}

.cta-pie{margin-top:11px;display:flex;justify-content:flex-end}

.chg{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}

.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--text3)}
.chg-txt{flex:1;line-height:1.5}

.chg-kind{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;background:rgba(255,255,255,.04);

.empty{padding:26px 18px;text-align:center;color:var(--text3);font-size:12.5px;line-height:1.6}

/* ===== temas ===== */
.tema-item{border-bottom:1px solid rgba(255,255,255,.06)}
.tema-item:last-of-type{border-bottom:none}
.tema{display:flex;align-items:center;gap:10px;padding:8px 0}
.tema-notas{padding:2px 0 13px 26px;display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tema-notas .reunion-box{margin-top:0}
.tema-flag{font-size:9.5px;font-weight:700;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tema .tx{flex:1;font-size:13px;background:transparent;border:none;color:var(--text);outline:none;padding:3px 0}
.tema.done .tx{text-decoration:line-through;color:var(--text3)}
.tema .del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px}
.tema .del:hover{color:var(--red)}

/* ===== heatmap ===== */
.hm{border-collapse:separate;border-spacing:0}
.hm th.wk{font-family:var(--mono);font-size:9px;text-align:center;padding:6px 3px;min-width:32px;color:var(--text3)}
.hm th.wk.now{color:var(--orange)}
.hm td.hc{padding:2px}
.hm .sq{width:100%;height:22px;border-radius:4px;display:block;background:rgba(255,255,255,.045)}
.hm .sq.verde{background:#16a34a}.hm .sq.amarillo{background:#f59e0b}.hm .sq.rojo{background:#dc2626}
.hm td.name,.hm th.name{position:sticky;left:0;background:var(--bg2);z-index:2;min-width:210px;max-width:250px}
.hm td.name{font-size:12.5px}
.hm tr.grp td{background:rgba(0,0,0,.2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:7px 14px}
.racha{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(239,68,68,.15);color:#ef6b6b;white-space:nowrap}

/* ===== personas ===== */
.persona{border-bottom:1px solid rgba(255,255,255,.07);padding:15px 18px}
.persona:last-child{border-bottom:none}
.obj{display:grid;grid-template-columns:1fr 160px 96px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.obj:last-child{border-bottom:none}
@media(max-width:740px){.obj{grid-template-columns:1fr;gap:7px}}
.obj-name{font-size:13px;line-height:1.35}
.obj-name small{display:block;color:var(--text3);font-size:11px;margin-top:2px}
.objs-hdr{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 2px}

/* ===== config ===== */
.cfg-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.cfg-row:last-child{border-bottom:none}
.cfg-row .nm{flex:1;min-width:140px;font-size:13px}
.cfg-add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.cfg-add .inp{flex:1;min-width:140px;width:auto}
.cfg-add select.inp{flex:0 0 130px}
.arch{opacity:.42}
.mini{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:3px 5px;line-height:1}
.mini:hover{color:var(--orange)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--orange);
  color:var(--text);font-size:13px;padding:11px 20px;border-radius:22px;z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast-btn{margin-left:12px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;
  background:var(--orange);color:#fff;border:none}
.toast-btn:hover{background:var(--orange2)}

/* ===== modal del reporte ===== */
.modal{position:fixed;inset:0;background:rgba(4,10,20,.78);z-index:800;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}

.modal-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}

.bus-ctx{font-size:11px;color:var(--text3)}
.bus-frag{font-size:12px;color:var(--text2);line-height:1.55;margin-top:6px}
mark{background:rgba(240,78,35,.28);color:#fff;border-radius:3px;padding:0 2px}
.modal-close:hover{color:var(--orange)}

}

// Rellena lo que falte para que datos viejos (o de otra versión) no rompan nada
function normalizar(raw){
  if(!raw || typeof raw !== 'object') return blank();
  raw.v = raw.v || 1;
  raw.cuentas = raw.cuentas || []; raw.personas = raw.personas || [];
  raw.inis = raw.inis || []; raw.semanas = raw.semanas || {};
  raw.tareas = raw.tareas || []; raw.recurrentes = raw.recurrentes || [];
  raw.personas.forEach(p => p.objetivos = p.objetivos || []);
  // Antes no existía el tipo de tarea y "Líder" se cargaba como si fuera una marca.
  // Al abrir por primera vez la versión nueva, esas pasan a ser tareas de líder.
  const esLider = m => /^\s*l[ií]der(es)?\s*$/i.test(m || '');
  raw.tareas.forEach(t=>{
    if(t.tipo) return;
    t.tipo = esLider(t.marca) ? 'lider' : 'marca';
    if(t.tipo === 'lider') t.marca = '';
  });
  raw.recurrentes.forEach(r=>{
    if(r.tipo) return;
    r.tipo = esLider(r.marca) ? 'lider' : 'marca';
    if(r.tipo === 'lider') r.marca = '';
  });
  // los temas viejos no tenían id: se los asignamos para poder abrirles las notas
  Object.keys(raw.semanas).forEach(k=>{
    (raw.semanas[k].temas || []).forEach(t=>{
      if(!t.id) t.id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    });
  });
  return raw;
}
function leerLocal(){
  try{ const r = JSON.parse(localStorage.getItem(LS)); return r && r.v ? normalizar(r) : null; }
  catch(e){ return null; }
}
function leerMeta(){ try{ return JSON.parse(localStorage.getItem(LS_META)) || {}; }catch(e){ return {}; } }
function guardarLocal(pendiente){
  try{
    localStorage.setItem(LS, JSON.stringify(S));
    localStorage.setItem(LS_META, JSON.stringify({version:VERSION, pendiente:!!pendiente, ts:Date.now()}));
  }catch(e){ console.warn('caché local no disponible', e); }
}
function tieneContenido(d){
  if(!d) return false;
  return !!(d.cuentas.length || d.personas.length || d.inis.length || d.tareas.length ||
    Object.keys(d.semanas||{}).length);
}

/* ---------- guardado en la nube ---------- */
let _t = null;
function save(){ guardarLocal(true); clearTimeout(_t); _t = setTimeout(saveNow, 900); }
function saveNow(){ clearTimeout(_t); guardarLocal(true); subir(); }

function marcarSync(estado){
  sincro = estado;
  const el = document.getElementById('sync');
  if(!el) return;
  const M = {
    ok:      ['ok','Guardado'],
    va:      ['va','Guardando…'],
    mal:     ['mal','Sin guardar — reintentando'],
    choque:  ['choque','Se editó desde otro lado']
  }[estado] || ['ok','Guardado'];
  el.innerHTML = '<span class="sync '+M[0]+'"'+
    (estado==='mal' ? ' onclick="subir()" title="Reintentar ahora"' : '')+
    (estado==='choque' ? ' onclick="resolverChoque()" title="Ver qué hacer"' : '')+
    '><i></i>'+M[1]+'</span>';
}
function subir(){
  if(!UID || !sb) return;
  clearTimeout(reintento);
  marcarSync('va');
  const nueva = VERSION + 1;
  sb.from('seg_estado')
    .update({datos:S, version:nueva, actualizado:new Date().toISOString()})
    .eq('user_id', UID).eq('version', VERSION).select('version')
    .then(function(r){
      if(r.error){ marcarSync('mal'); reintento = setTimeout(subir, 8000); return; }
      if(!r.data || !r.data.length){ marcarSync('choque'); return; }  // otro dispositivo guardó primero
      VERSION = nueva; guardarLocal(false); marcarSync('ok');
    }, function(){ marcarSync('mal'); reintento = setTimeout(subir, 8000); });
}
function resolverChoque(){
  const q = 'Se guardaron cambios desde otra pestaña o dispositivo, así que no piso nada sin preguntarte.\n\n'+
    'Aceptar: traigo la versión de la nube y pierdo lo que escribiste acá desde entonces.\n'+
    'Cancelar: subo lo de esta pantalla y piso lo otro.';
  if(confirm(q)) location.reload();
  else {
    sb.from('seg_estado').select('version').eq('user_id', UID).maybeSingle().then(function(r){
      if(r.data){ VERSION = r.data.version; subir(); }
    });
  }
}
// reintentar solo cuando puede servir
window.addEventListener('online', ()=>{ if(sincro === 'mal') subir(); });
window.addEventListener('focus',  ()=>{ if(sincro === 'mal') subir(); });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Texto de usuario dentro de un onclick="...": pasa por dos capas — primero el
   parser de HTML decodifica el atributo, después JS lee el string. Hay que escapar
   para las dos o un apóstrofe en "O'Higgins" corta el string y el botón no hace nada.
   (esc() solo no alcanza: convierte ' en &#39; y el parser lo devuelve como '.) */
function jsArg(s){
  return "'" + String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")     // capa JS
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')  // capa HTML
    .replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/[\r\n]+/g,' ') + "'";
}

/* ---------- semanas ---------- */
function wkKey(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return isoDate(x);
}
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function shiftKey(k,n){ return isoDate(addDays(parseISO(k), n*7)); }
function wkNum(k){
  const t = parseISO(k); t.setDate(t.getDate()+3);
  const w1 = new Date(t.getFullYear(),0,4);
  return 1 + Math.round(((t-w1)/86400000 - 3 + ((w1.getDay()+6)%7)) / 7);
}
function wkLabel(k){
  const a = parseISO(k), b = addDays(a,6);
  const mA = MESES[a.getMonth()], mB = MESES[b.getMonth()];
  return a.getDate()+' '+(mA===mB?'':mA+' ')+'– '+b.getDate()+' '+mB;
}
const thisWk = () => wkKey(new Date());

function W(create){
  let w = S.semanas[cur];
  if(!w){ if(!create) return EMPTY; w = {inis:{}, cuentas:{}, personas:{}, temas:[], nota:'', acuerdos:''}; S.semanas[cur] = w; }
  w.inis = w.inis||{}; w.cuentas = w.cuentas||{}; w.personas = w.personas||{}; w.temas = w.temas||[];
  return w;
}
function hasData(k){
  const w = S.semanas[k]; if(!w) return false;
  return Object.keys(w.inis||{}).length || Object.keys(w.cuentas||{}).length ||
         Object.keys(w.personas||{}).length || (w.temas||[]).length || w.nota || w.acuerdos;
}

/* ---------- lectura por semana ---------- */
function rIni(k,id){ const w = S.semanas[k]; return (w && w.inis && w.inis[id]) || {}; }
function rCta(k,id){ const w = S.semanas[k]; return (w && w.cuentas && w.cuentas[id]) || {}; }
function rNiv(k,id,n){ const c = rCta(k,id); return (c.niveles && c.niveles[n]) || {}; }
function rPer(k,id){ const w = S.semanas[k]; return (w && w.personas && w.personas[id]) || {}; }
function rObj(k,pid,oid){ const p = rPer(k,pid); return (p.objs && p.objs[oid]) || {}; }
function ctaGeneral(k,id){
  let peor = null;
  NIVELES.forEach(n => { const e = rNiv(k,id,n.k).estado; if(e && (!peor || RANK[e] > RANK[peor])) peor = e; });
  return peor;
}
function perAvance(k,pid){
  const p = S.personas.find(x=>x.id===pid); if(!p) return null;
  const act = p.objetivos.filter(o=>!o.arch);
  if(!act.length) return null;
  const tot = act.reduce((s,o)=> s + (rObj(k,pid,o.id).avance||0), 0);
  return Math.round(tot/act.length);
}

/* ---------- escritura (semana actual) ---------- */
function eIni(id){ const w = W(true); if(!w.inis[id]) w.inis[id] = {estado:null, avance:0, paso:'', nota:'', reunion:''}; return w.inis[id]; }
function eCta(id){
  const w = W(true);
  if(!w.cuentas[id]) w.cuentas[id] = {niveles:{}, nota:''};
  const c = w.cuentas[id]; c.niveles = c.niveles || {};
  NIVELES.forEach(n => { if(!c.niveles[n.k]) c.niveles[n.k] = {estado:null, nota:''}; });
  return c;
}
function ePer(id){ const w = W(true); if(!w.personas[id]) w.personas[id] = {estado:null, nota:'', objs:{}}; const p = w.personas[id]; p.objs = p.objs||{}; return p; }
function eObj(pid,oid){ const p = ePer(pid); if(!p.objs[oid]) p.objs[oid] = {estado:null, avance:0, nota:''}; return p.objs[oid]; }

const nextEst = e => { const i = ESTADOS.indexOf(e); return i < 0 ? 'verde' : (i === ESTADOS.length-1 ? null : ESTADOS[i+1]); };

function cycIni(id){ const e = eIni(id); e.estado = nextEst(e.estado); saveNow(); render(); }
function cycNiv(id,n){ const c = eCta(id); c.niveles[n].estado = nextEst(c.niveles[n].estado); saveNow(); render(); }
function cycPer(id){ const p = ePer(id); p.estado = nextEst(p.estado); saveNow(); render(); }
function cycObj(pid,oid){ const o = eObj(pid,oid); o.estado = nextEst(o.estado); saveNow(); render(); }

function setIni(id,f,v){ eIni(id)[f] = v; save(); }
function setMasterIni(id,f,v){ const i = S.inis.find(x=>x.id===id); if(i){ i[f] = v; save(); } }
function toggleDesc(id){ descOpen[id] = !descOpen[id]; render(); }
function histReunion(id,n){
  const out = []; let k = shiftKey(cur,-1);
  for(let i=0; i<16 && out.length<n; i++){
    const r = rIni(k,id).reunion;
    if(r) out.push({k:k, txt:r});
    k = shiftKey(k,-1);
  }
  return out;
}
function setNiv(id,n,v){ eCta(id).niveles[n].nota = v; save(); }
function setCtaNota(id,v){ eCta(id).nota = v; save(); }
function setPer(id,f,v){ ePer(id)[f] = v; save(); }
function setObj(pid,oid,f,v){ eObj(pid,oid)[f] = v; save(); }
// el slider y el número escriben el mismo dato y se espejan entre sí
function sincroAvance(key, v){
  const s = document.getElementById('sl-'+key), n = document.getElementById('av-'+key);
  if(s && s.value != v) s.value = v;
  if(n && n.value != v && document.activeElement !== n) n.value = v;
}
function limitar(v){ v = parseInt(v,10); if(isNaN(v)) v = 0; return Math.max(0, Math.min(100, v)); }
function setAvIni(id,v){ const n = limitar(v); eIni(id).avance = n; sincroAvance(id, n); save(); }
function setAvObj(pid,oid,v){ const n = limitar(v); eObj(pid,oid).avance = n; sincroAvance(oid, n); save(); }
function setWeekField(f,v){ W(true)[f] = v; save(); }

/* ---------- editor de notas con formato ---------- */
const ES_HTML = /<(br|div|span|b|i|u|p|ul|ol|li|font|strong|em)[\s>\/]/i;
function toHtml(v){
  v = v == null ? '' : String(v);
  if(!v) return '';
  return ES_HTML.test(v) ? v : esc(v).replace(/\n/g,'<br>');
}
function toText(v){
  if(!v) return '';
  if(!ES_HTML.test(String(v))) return String(v);
  return String(v)
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n').replace(/<li[^>]*>/gi,'· ')
    .replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'").replace(/&amp;/g,'&')
    .replace(/\n{3,}/g,'\n\n').trim();
}
function richIn(el){
  const h = el.innerHTML;
  if(h === '<br>' || h === '<div><br></div>' || h === '<p><br></p>'){ el.innerHTML = ''; return ''; }
  return h;
}
function pastePlain(e){
  e.preventDefault();
  const t = ((e.clipboardData || window.clipboardData).getData('text/plain') || '');
  document.execCommand('insertText', false, t);
}
function fmt(cmd, val){
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  document.execCommand(cmd, false, val || null);
  const el = document.activeElement;
  if(el && el.classList && el.classList.contains('rich-body')) el.dispatchEvent(new Event('input'));
}
const COLORES = [['#f0f0f0','Sin color'],['#f04e23','Naranja'],['#ef4444','Rojo'],['#f59e0b','Amarillo'],['#22c55e','Verde'],['#7a9eca','Azul']];
function richTools(){
  return '<div class="rich-tools no-print">'+
    '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'bold\')" title="Negrita — Ctrl+B"><b>B</b></button>'+
    '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'italic\')" title="Cursiva — Ctrl+I"><i>I</i></button>'+
    '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'insertUnorderedList\')" title="Lista">&bull;</button>'+
    '<span class="tools-sep"></span>'+
    COLORES.map(c=>'<button type="button" class="sw" style="background:'+c[0]+'" title="'+c[1]+'" '+
      'onmousedown="event.preventDefault()" onclick="fmt(\'foreColor\',\''+c[0]+'\')"></button>').join('')+
    '<span class="tools-sep"></span>'+
    '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'removeFormat\')" title="Limpiar formato">&times;</button>'+
  '</div>';
}
function richBox(key, val, saveExpr, ph, minH){
  return '<div class="rich" data-k="'+key+'">'+
    '<div class="rich-body" contenteditable="true" spellcheck="true" data-ph="'+esc(ph||'')+'"'+
      (minH ? ' style="min-height:'+minH+'px"' : '')+
      ' onpaste="pastePlain(event)" oninput="'+saveExpr+'">'+toHtml(val)+'</div>'+
    richTools()+

}
function placeCaretEnd(el){
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* ---------- render base ---------- */
/* nav = [tipo, id, sub] habilita la carga con teclado: el chip toma foco y
   responde 1/2/3 (verde/amarillo/rojo), 0 o Supr para vaciarlo, y flechas
   para moverse. Sin nav, el chip es solo clickeable. */
function semChip(estado, onclick, small, ro, nav){
  const cls = 'sem sem-'+(estado||'null')+(small?' sm':'')+(ro?' ro':'');
  const txt = estado ? estado : 'sin cargar';
  let extra = '';
  if(nav){
    extra = ' tabindex="0" data-k="ch-'+nav.join('-')+'" data-chip="1"'+
      ' onkeydown="chipTecla(event,'+jsArg(nav[0])+','+jsArg(nav[1])+','+jsArg(nav[2]||'')+')"';
  }
  return '<span class="'+cls+'"'+(onclick?' onclick="'+onclick+'"':'')+extra+
    ' title="'+(ro?'':(nav?'Click, o 1 / 2 / 3 con el teclado':'Click para cambiar'))+'">'+txt+'</span>';
}
function setEstado(tipo, id, sub, val){
  if(tipo === 'ini') eIni(id).estado = val;
  else if(tipo === 'niv') eCta(id).niveles[sub].estado = val;
  else if(tipo === 'per') ePer(id).estado = val;
  else if(tipo === 'obj') eObj(id, sub).estado = val;
  saveNow(); render();
}
function ciclar(tipo, id, sub){
  if(tipo === 'ini') cycIni(id);
  else if(tipo === 'niv') cycNiv(id, sub);
  else if(tipo === 'per') cycPer(id);
  else if(tipo === 'obj') cycObj(id, sub);
}
function moverChip(desde, paso){
  const chips = [...document.querySelectorAll('.pane.active [data-chip]')];
  const i = chips.indexOf(desde);
  if(i < 0) return;
  const j = Math.max(0, Math.min(chips.length-1, i + paso));
  chips[j].focus();
}
function chipTecla(e, tipo, id, sub){
  const k = e.key;
  const salto = (tab === 'cuentas') ? NIVELES.length : 1;   // en la grilla de cuentas, arriba/abajo cambia de fila
  if(k === '1' || k === '2' || k === '3'){
    e.preventDefault(); e.stopPropagation();
    setEstado(tipo, id, sub, ESTADOS[+k - 1]);
    return;
  }
  if(k === '0' || k === 'Backspace' || k === 'Delete'){
    e.preventDefault(); e.stopPropagation(); setEstado(tipo, id, sub, null); return;
  }
  if(k === 'Enter' || k === ' '){ e.preventDefault(); e.stopPropagation(); ciclar(tipo, id, sub); return; }
  if(k.indexOf('Arrow') === 0){
    e.preventDefault(); e.stopPropagation();
    moverChip(e.currentTarget, k === 'ArrowRight' ? 1 : k === 'ArrowLeft' ? -1 : k === 'ArrowDown' ? salto : -salto);
  }
}
const TIP_TECLAS = '<span class="hint teclas">Con el teclado: <b>1</b> verde · <b>2</b> amarillo · <b>3</b> rojo · <b>0</b> vac&iacute;a · <b>Tab</b> o flechas para moverte</span>';
function prevNote(txt, lbl){
  if(!txt || !toText(txt)) return '';
  return '<div class="prev-note"><b>'+(lbl||'Semana anterior')+'</b>'+toHtml(txt)+'</div>';
}
function deltaTag(now, prev){
  if(prev==null) return '';
  const d = (now||0) - (prev||0);
  const cls = d>0?'up':(d<0?'down':'flat');
  return '<span class="delta '+cls+'">'+(d>0?'+':'')+d+'</span>';
}
const activos = arr => arr.filter(x=>!x.arch);
// Si la cuenta no tiene célula propia, usamos el responsable: el campo viejo se
// llamaba "Responsable / célula" y ahí quedaron cargados los equipos.
function celulaDe(c){
  const v = ((c.celula||'').trim() || (c.resp||'').trim());
  // "N/A", "-", "s/d" son marcadores de vacío, no células: no merecen su propio grupo ni filtro
  return /^(n\/?a|s\/?d|-+|—+|\.|sin|ninguna)$/i.test(v) ? '' : v;
}
function celulas(){
  const set = [];
  S.cuentas.forEach(c=>{ const v = celulaDe(c); if(v && !set.includes(v)) set.push(v); });
  return set.sort((a,b)=>a.localeCompare(b,'es'));
}

function tabsHtml(){
  const prev = shiftKey(cur,-1);
  const risk = activos(S.inis).filter(i=>rIni(cur,i.id).estado==='rojo').length;
  const ctaRojo = activos(S.cuentas).filter(c=>ctaGeneral(cur,c.id)==='rojo').length;
  const perRisk = activos(S.personas).filter(p=>{const e=rPer(cur,p.id).estado; return e==='rojo'||e==='amarillo';}).length;
  const hoy = isoDate(new Date());
  const vencidas = (S.tareas||[]).filter(t=>!t.hecha && t.fecha && t.fecha < hoy).length;
  const defs = [
    ['resumen','1:1', null],
    ['proyectos','Proyectos / Rocks', risk],
    ['cuentas','Cuentas', ctaRojo],
    ['personas','Personas', perRisk],
    ['tareas','Mis tareas', vencidas],
    ['evolucion','Evolución', null],
    ['config','Config', null]
  ];
  return defs.map(d=>{
    const cnt = d[2]!=null && d[2]>0 ? '<span class="tab-count warn">'+d[2]+'</span>' : '';
    return '<button class="tab'+(tab===d[0]?' active':'')+'" onclick="go(\''+d[0]+'\')">'+d[1]+cnt+'</button>';
  }).join('');
}

function go(t){ tab = t; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function navWeek(n){
  const k = shiftKey(cur,n);
  if(n>0 && k > thisWk()) return;
  cur = k; openCta = null; render();
}
function goToday(){ cur = thisWk(); render(); }

function render(){
  // si estabas escribiendo en un editor, volvemos a él después de redibujar
  const ae = document.activeElement;
  let foco = null;
  if(ae && ae.classList){
    if(ae.classList.contains('rich-body') && ae.closest('.rich')) foco = ae.closest('.rich').dataset.k;
    else if(ae.dataset && ae.dataset.k) foco = ae.dataset.k;   // chips de semáforo
  }
  document.getElementById('tabs').innerHTML = tabsHtml();
  const lbl = document.getElementById('wklabel');
  const esta = cur === thisWk();
  lbl.innerHTML = '<b>Sem '+wkNum(cur)+'</b> · '+wkLabel(cur)+'<small>'+(esta?'semana actual':parseISO(cur).getFullYear())+'</small>';
  document.getElementById('btn-next').disabled = shiftKey(cur,1) > thisWk();
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  const pane = document.getElementById('pane-'+tab);
  pane.classList.add('active');
  pane.innerHTML = ({resumen:vResumen, proyectos:vProyectos, cuentas:vCuentas, personas:vPersonas,
                     tareas:vTareas, evolucion:vEvolucion, config:vConfig})[tab]();
  if(foco){
    const el = pane.querySelector('.rich[data-k="'+foco+'"] .rich-body') || pane.querySelector('[data-k="'+foco+'"]');
    if(el){ el.focus(); if(el.classList.contains('rich-body')) placeCaretEnd(el); }
  }
}

/* ---------- llevar cualquier cosa a los temas del 1:1 ---------- */
function alUnoAUno(txt, nota){
  const w = W(true);
  if(w.temas.some(t=>t.txt === txt)){ toast('Ya está en los temas de esta semana'); return; }
  const t = {id:uid(), txt:txt, ok:false, nota:nota || '', reunion:''};
  w.temas.push(t); temaOpen[t.id] = !!nota;
  saveNow(); render();
  toast('"'+ (txt.length>34?txt.slice(0,32)+'…':txt) +'" agregado a los temas del 1:1');
}
function btnAlUno(txt, nota){
  return '<button class="btn-ghost no-print" title="Sumarlo a los temas del 1:1 de esta semana" '+
    'onclick="event.stopPropagation();alUnoAUno('+jsArg(txt)+','+jsArg(nota)+')">&rarr; 1:1</button>';
}

/* ============================================================
   VISTA — 1:1
   ============================================================ */
function cambios(){
  const p = shiftKey(cur,-1);
  if(!hasData(p)) return [];
  const out = [];
  const push = (kind,nombre,a,b,extra) => {
    let dir;
    if(a && b) dir = RANK[b] < RANK[a] ? 'up' : 'down';
    else if(!a && b) dir = b === 'verde' ? 'up' : 'down';   // recién cargado
    else dir = 'flat';                                      // se descargó
    out.push({kind, nombre, de:a||null, a:b||null, dir, extra:extra||''});
  };
  activos(S.inis).forEach(i=>{
    const a = rIni(p,i.id).estado, b = rIni(cur,i.id).estado;
    if(a !== b && (a||b)) push(TIPOS.find(t=>t.k===i.tipo).n, i.nombre, a, b);
  });
  activos(S.cuentas).forEach(c=>{
    NIVELES.forEach(n=>{
      const a = rNiv(p,c.id,n.k).estado, b = rNiv(cur,c.id,n.k).estado;
      if(a !== b && (a||b)) push('Cuenta', c.nombre, a, b, n.n);
    });
  });
  activos(S.personas).forEach(pe=>{
    const a = rPer(p,pe.id).estado, b = rPer(cur,pe.id).estado;
    if(a !== b && (a||b)) push('Persona', pe.nombre, a, b);
  });
  return out.sort((x,y)=> (x.dir==='down'?-1:1) - (y.dir==='down'?-1:1));
}
function rachaRojo(getter){
  let n = 0, k = cur;
  for(let i=0;i<26;i++){
    if(!hasData(k)) break;
    if(getter(k) === 'rojo'){ n++; k = shiftKey(k,-1); } else break;
  }
  return n;
}
function alertas(){
  const out = [];
  activos(S.cuentas).forEach(c=>{
    const r = rachaRojo(k=>ctaGeneral(k,c.id));
    if(r >= 2) out.push({txt:'<b>'+esc(c.nombre)+'</b> lleva <b>'+r+' semanas</b> en rojo', kind:'Cuenta'});
  });
  activos(S.inis).forEach(i=>{
    const r = rachaRojo(k=>rIni(k,i.id).estado);
    if(r >= 2) out.push({txt:'<b>'+esc(i.nombre)+'</b> lleva <b>'+r+' semanas</b> en rojo', kind:TIPOS.find(t=>t.k===i.tipo).n});
    const p = shiftKey(cur,-1);
    if(hasData(p) && i.tipo !== 'tarea'){
      const av = rIni(cur,i.id).avance||0, pv = rIni(p,i.id).avance||0;
      const est = rIni(cur,i.id).estado;
      if(est && est !== 'verde' && av === pv && av < 100)
        out.push({txt:'<b>'+esc(i.nombre)+'</b> sin movimiento de avance ('+av+'%) y en '+est, kind:'Sin avance'});
    }
    if(i.fecha && (rIni(cur,i.id).avance||0) < 100 && i.fecha < isoDate(addDays(parseISO(cur),6)))
      out.push({txt:'<b>'+esc(i.nombre)+'</b> venció el '+i.fecha+' y está al '+(rIni(cur,i.id).avance||0)+'%', kind:'Vencido'});
  });
  activos(S.personas).forEach(pe=>{
    const r = rachaRojo(k=>rPer(k,pe.id).estado);
    if(r >= 2) out.push({txt:'<b>'+esc(pe.nombre)+'</b> lleva <b>'+r+' semanas</b> en rojo', kind:'Persona'});
  });
  return out;
}

/* La fecha se lee en palabras: "ayer" o "hace 4 días" dice mucho más que 21/08.
   El color va con la urgencia, no con el calendario. */
function fechaHumana(iso, hecha){
  if(!iso) return {txt:'sin fecha', cls:'vacia'};
  const hoy = parseISO(isoDate(new Date()));
  const d = Math.round((parseISO(iso) - hoy) / 86400000);
  if(hecha) return {txt:d === 0 ? 'hoy' : (iso.slice(8)+'/'+iso.slice(5,7)), cls:'list'};
  if(d < -1)  return {txt:'hace '+(-d)+' días', cls:'roja'};
  if(d === -1) return {txt:'ayer', cls:'roja'};
  if(d === 0)  return {txt:'hoy', cls:'naranja'};
  if(d === 1)  return {txt:'mañana', cls:'prox'};
  if(d <= 7)   return {txt:DIA_CORTO[(parseISO(iso).getDay()+6)%7]+' '+parseISO(iso).getDate(), cls:'prox'};
  return {txt:iso.slice(8)+'/'+iso.slice(5,7), cls:''};
}
function proximoLunes(){
  const d = new Date(), falta = (8 - ((d.getDay()+6)%7 + 1)) % 7 || 7;
  return isoDate(addDays(d, falta));
}

/* ============================================================
   Gráficos de Mis tareas
   Paleta validada con el script del skill de dataviz contra el
   fondo real (#112240): naranja #f04e23 para "cerradas" (serie
   única) y el par #3987e5 / #ef4444 para "a tiempo / vencidas"
   (pasa banda de luminosidad, croma, separación CVD y contraste).
   ============================================================ */
const VIZ = {acc:'#f04e23', s1:'#3987e5', crit:'#ef4444',
  grid:'rgba(255,255,255,.07)', axis:'#8892a4', surf:'#112240'};
// rampa ordinal (un solo tono, validada con --ordinal sobre el navy): recién
// abiertas apagadas, las más viejas más brillantes = las que hay que mirar
const RAMPA = ['#1c5cab','#2a78d6','#5598e7','#9ec5f4'];
const DIA_CORTO = ['lun','mar','mié','jue','vie','sáb','dom'];

function tip(e, html){
  const el = document.getElementById('viztip');
  el.innerHTML = html; el.classList.add('on');
  const r = el.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if(x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
  if(y < 8) y = e.clientY + 18;
  el.style.left = x+'px'; el.style.top = y+'px';
}
function tipOff(){ document.getElementById('viztip').classList.remove('on'); }

// barra vertical: punta redondeada 4px, base cuadrada sobre la línea de cero
function colPath(x,y,w,h,r){
  if(h <= 0.5) return '';
  r = Math.min(r, w/2, h);
  return 'M'+x+','+(y+h)+' V'+(y+r)+' a'+r+','+r+' 0 0 1 '+r+',-'+r+
         ' h'+(w-2*r)+' a'+r+','+r+' 0 0 1 '+r+','+r+' V'+(y+h)+' Z';
}
// barra horizontal: punta redondeada a la derecha, base cuadrada en el eje
function rowPath(x,y,w,h,r){
  if(w <= 0.5) return '';
  r = Math.min(r, h/2, w);
  return 'M'+x+','+y+' h'+(w-r)+' a'+r+','+r+' 0 0 1 '+r+','+r+
         ' v'+(h-2*r)+' a'+r+','+r+' 0 0 1 '+(-r)+','+r+' H'+x+' Z';
}
const ticksLindos = max => {
  if(max <= 1) return [0,1];
  if(max <= 4) return [0, max];
  const paso = Math.ceil(max/2);
  return [0, paso, paso*2];
};

/* --- datos --- */
function cerradasPorDia(){
  const lunes = parseISO(wkKey(new Date()));
  return DIA_CORTO.map((d,i)=>{
    const f = isoDate(addDays(lunes,i));
    return {dia:d, fecha:f, n:(S.tareas||[]).filter(t=>t.hecha && t.cerrada === f).length};
  });
}
function cerradasPorSemana(n){
  const out = []; let k = wkKey(new Date());
  for(let i=0;i<n;i++){
    const ini = k, fin = isoDate(addDays(parseISO(k),6));
    out.unshift({k:k, sem:wkNum(k),
      n:(S.tareas||[]).filter(t=>t.hecha && t.cerrada && t.cerrada >= ini && t.cerrada <= fin).length});
    k = shiftKey(k,-1);
  }
  return out;
}
function pendientesPorMarca(){
  const hoy = isoDate(new Date()), mapa = [];
  (S.tareas||[]).filter(t=>!t.hecha).forEach(t=>{
    const m = (t.marca||'').trim() || 'Sin marca';
    let g = mapa.find(x=>x.m === m);
    if(!g){ g = {m:m, alDia:0, venc:0}; mapa.push(g); }
    if(t.fecha && t.fecha < hoy) g.venc++; else g.alDia++;
  });
  mapa.forEach(g=> g.tot = g.alDia + g.venc);
  mapa.sort((a,b)=> b.tot - a.tot || b.venc - a.venc);
  if(mapa.length > 6){                       // el resto se pliega en "Otras", no se generan colores nuevos
    const resto = mapa.splice(6);
    mapa.push({m:'Otras ('+resto.length+')', alDia:resto.reduce((s,x)=>s+x.alDia,0),
      venc:resto.reduce((s,x)=>s+x.venc,0), tot:resto.reduce((s,x)=>s+x.tot,0)});
  }
  return mapa;
}

/* --- gráfico 2: pendientes por marca (2 series: estado) --- */
function vizPorMarca(){
  const datos = pendientesPorMarca();
  if(!datos.length) return '<div class="viz-empty">No tenés tareas pendientes. 👌</div>';
  const W = 640, fila = 22, pt = 3, pr = 32, anchoNom = 130;
  const H = pt + datos.length*fila + 3;
  const max = Math.max(...datos.map(d=>d.tot));
  const escala = (W - anchoNom - pr) / Math.max(1,max);
  const bh = 14;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tareas pendientes por marca, separadas entre a tiempo y vencidas">';
  datos.forEach((d,i)=>{
    const y = pt + i*fila, yb = y + (fila-bh)/2;
    const wA = d.alDia*escala, wV = d.venc*escala;
    const nom = d.m.length > 19 ? d.m.slice(0,18)+'…' : d.m;
    s += '<text x="2" y="'+(yb+bh/2+3.5)+'" font-size="10.5" fill="var(--text2)">'+esc(nom)+'</text>';
    // 2px de aire entre los dos tramos: los separa el fondo, no un borde.
    // Solo la punta del apilado va redondeada; el tramo interior queda a escuadra.
    if(wA > 0.5) s += (wV > 0.5
      ? '<rect x="'+anchoNom+'" y="'+yb+'" width="'+Math.max(0,wA-2)+'" height="'+bh+'" fill="'+VIZ.s1+'"/>'
      : '<path d="'+rowPath(anchoNom, yb, wA, bh, 4)+'" fill="'+VIZ.s1+'"/>');
    if(wV > 0.5) s += '<path d="'+rowPath(anchoNom+wA, yb, wV, bh, 4)+'" fill="'+VIZ.crit+'"/>';
    s += '<text x="'+(anchoNom+wA+wV+7)+'" y="'+(yb+bh/2+3.5)+'" font-size="10.5" font-weight="700" fill="var(--text)">'+d.tot+'</text>';
    s += '<rect x="0" y="'+y+'" width="'+W+'" height="'+fila+'" fill="transparent" '+
      'onmousemove="tip(event,'+jsArg('<b>'+esc(d.m)+'</b>')+'+\'<br>'+
        '<span class=&quot;k&quot;><i style=&quot;background:'+VIZ.s1+'&quot;></i>'+d.alDia+' a tiempo</span><br>'+
        '<span class=&quot;k&quot;><i style=&quot;background:'+VIZ.crit+'&quot;></i>'+d.venc+' vencida'+(d.venc===1?'':'s')+'</span>\')" '+
      'onmouseleave="tipOff()"/>';
  });
  return s + '</svg>';
}

/* --- gráfico 4: antigüedad de las pendientes (bandas ordenadas, rampa de un tono) --- */
function antiguedadPendientes(){
  const ahora = new Date();
  const bandas = [{n:'≤ 7 días'},{n:'8 a 14'},{n:'15 a 30'},{n:'+30 días'}].map(b=>({n:b.n, c:0, ej:null}));
  let sinFecha = 0;
  (S.tareas||[]).filter(t=>!t.hecha).forEach(t=>{
    const base = t.creada || t.fecha;
    if(!base){ sinFecha++; return; }
    const dias = Math.max(0, Math.floor((ahora - parseISO(base))/86400000));
    const i = dias <= 7 ? 0 : dias <= 14 ? 1 : dias <= 30 ? 2 : 3;
    bandas[i].c++;
    if(!bandas[i].ej || dias > bandas[i].ej.d) bandas[i].ej = {t:t.titulo, d:dias};
  });
  bandas.sinFecha = sinFecha;
  return bandas;
}
function vizAntiguedad(){
  const datos = antiguedadPendientes();
  const total = datos.reduce((s,b)=>s+b.c,0);
  if(!total) return '<div class="viz-empty">Sin pendientes abiertas. 👌</div>';
  const W = 640, H = 136, pl = 26, pr = 6, pt = 20, pb = 22;
  const max = Math.max(...datos.map(b=>b.c));
  const tk = ticksLindos(max), tope = tk[tk.length-1];
  const banda = (W-pl-pr)/datos.length, bw = Math.min(30, banda-26);
  const yDe = v => pt + (H-pt-pb) * (1 - v/tope);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tareas pendientes según cuántos días llevan abiertas">';
  tk.forEach(v=>{
    s += '<line x1="'+pl+'" y1="'+yDe(v)+'" x2="'+(W-pr)+'" y2="'+yDe(v)+'" stroke="'+VIZ.grid+'" stroke-width="1"/>'+
      '<text x="'+(pl-6)+'" y="'+(yDe(v)+3.5)+'" text-anchor="end" font-size="9" fill="'+VIZ.axis+'">'+v+'</text>';
  });
  datos.forEach((b,i)=>{
    const x = pl + banda*i + (banda-bw)/2, y = yDe(b.c), h = yDe(0)-y;
    if(b.c) s += '<path d="'+colPath(x,y,bw,h,4)+'" fill="'+RAMPA[i]+'"/>';
    if(b.c === max && b.c > 0)
      s += '<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">'+b.c+'</text>';
    s += '<text x="'+(x+bw/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9.5" fill="'+VIZ.axis+'">'+b.n+'</text>';
    const ej = b.ej ? '<br><span style=&quot;color:#8892a4&quot;>la más vieja: '+
      jsArg(esc(b.ej.t.slice(0,28))).slice(1,-1)+' ('+b.ej.d+' d)</span>' : '';

      'onmousemove="tip(event,\'<b>'+b.n+' abiertas</b><br>'+b.c+' tarea'+(b.c===1?'':'s')+ej+'\')" onmouseleave="tipOff()"/>';
  });
  s += '<line x1="'+pl+'" y1="'+yDe(0)+'" x2="'+(W-pr)+'" y2="'+yDe(0)+'" stroke="rgba(255,255,255,.16)" stroke-width="1"/>';
  return s + '</svg>';
}

function vTareasResumen(){
  const hoy = isoDate(new Date());
  const lunes = wkKey(new Date()), domingo = isoDate(addDays(parseISO(lunes),6));
  const T = S.tareas || [];
  const hechasSem = T.filter(t=>t.hecha && t.cerrada && t.cerrada >= lunes && t.cerrada <= domingo).length;
  const lunPrev = shiftKey(lunes,-1), domPrev = isoDate(addDays(parseISO(lunPrev),6));
  const hechasPrev = T.filter(t=>t.hecha && t.cerrada && t.cerrada >= lunPrev && t.cerrada <= domPrev).length;
  const pendientes = T.filter(t=>!t.hecha).length;
  const vencidas = T.filter(t=>!t.hecha && t.fecha && t.fecha < hoy).length;
  const paraHoy = T.filter(t=>!t.hecha && t.fecha === hoy).length;
  const delSem = T.filter(t=>t.fecha && t.fecha >= lunes && t.fecha <= domingo);
  const cumpl = delSem.length ? Math.round(delSem.filter(t=>t.hecha).length/delSem.length*100) : null;
  const dif = hechasSem - hechasPrev;

  let h = '<div class="section"><div class="section-hdr">'+
    '<div class="section-title"><span class="dot"></span>Resumen de la semana</div>'+
    '<div style="display:flex;gap:6px;align-items:center">'+
      '<span class="hint">Sem '+wkNum(lunes)+' · '+wkLabel(lunes)+'</span>'+
      '<button class="btn-sm" onclick="vizTabla=!vizTabla;render()">'+(vizTabla?'Ver gráficos':'Ver números')+'</button>'+
      '<button class="btn-sm" onclick="vizOpen=!vizOpen;render()">'+(vizOpen?'Ocultar':'Mostrar')+'</button>'+
    '</div></div>';
  if(!vizOpen) return h + '</div>';

  h += '<div class="section-body" style="padding:12px 18px 0"><div class="kpi-row compacta" style="margin-bottom:4px">'+
    kpi('Hechas esta semana', hechasSem,
      (hechasPrev || hechasSem) ? (dif>0?'+'+dif:dif)+' vs. semana pasada' : 'primera semana', hechasSem?'ok':'')+
    kpi('Pendientes', pendientes, (T.length-pendientes)+' cerradas en total', pendientes?'acc':'ok')+
    kpi('Vencidas', vencidas, vencidas?'pasaron su fecha':'ninguna atrasada', vencidas?'bad':'ok')+
    kpi('Para hoy', paraHoy, paraHoy?'con fecha de hoy':'nada agendado para hoy', paraHoy?'warn':'')+
    kpi('Cumplimiento', cumpl==null?'—':cumpl+'%',
      cumpl==null?'sin tareas con fecha':delSem.filter(t=>t.hecha).length+' de '+delSem.length+' con fecha esta semana',
      cumpl==null?'':(cumpl>=80?'ok':(cumpl>=50?'warn':'bad')))+
  '</div></div>';

  if(vizTabla) return h + vizTablaHtml() + '</div>';

  h += '<div class="viz-grid">'+
    '<div class="viz"><div class="viz-hdr"><div class="viz-t">Cerradas por día</div>'+
      '<div class="viz-s">Cuándo descargás la semana</div></div>'+vizPorDia()+'</div>'+
    '<div class="viz"><div class="viz-hdr"><div class="viz-t">Cerradas por semana</div>'+
      '<div class="viz-s">Últimas 8 semanas</div></div>'+vizPorSemana()+'</div>'+
    '<div class="viz"><div class="viz-hdr"><div class="viz-t">Pendientes por marca</div>'+
      '<div class="viz-s">Dónde está la mochila hoy</div></div>'+
      '<div class="viz-legend">'+
        '<span class="viz-key"><i style="background:'+VIZ.s1+'"></i>A tiempo</span>'+
        '<span class="viz-key"><i style="background:'+VIZ.crit+'"></i>Vencidas</span>'+
      '</div>'+vizPorMarca()+'</div>'+
    '<div class="viz"><div class="viz-hdr"><div class="viz-t">Antigüedad de las pendientes</div>'+
      '<div class="viz-s">Hace cuánto están abiertas — cuanto más claro, más viejo</div></div>'+vizAntiguedad()+'</div>'+
  '</div>';
  return h + '</div>';
}

/* --- tareas que se repiten solas --- */
const FRECS = [['diaria','Todos los días'],['habiles','Lunes a viernes'],['semanal','Una vez por semana']];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function generarRecurrentes(){
  const hoy = isoDate(new Date());
  const dow = new Date().getDay();
  let cambio = false;
  (S.recurrentes||[]).forEach(r=>{
    if(!r.activa) return;
    if(r.ultimaGen === hoy) return;                                  // ya se corrió hoy
    if(r.freq === 'habiles' && (dow === 0 || dow === 6)) return;      // fin de semana
    if(r.freq === 'semanal' && dow !== +r.dia) return;                // no es su día
    // si quedó una pendiente de días anteriores, la corremos a hoy en vez de duplicarla
    const pendiente = S.tareas.find(t=>t.recId === r.id && !t.hecha);
    if(pendiente) pendiente.fecha = hoy;
    else S.tareas.push({id:uid(), titulo:r.titulo, tipo:r.tipo || (r.marca?'marca':'lider'),
      marca:r.marca||'', fecha:hoy, desc:r.desc||'', hecha:false, recId:r.id, creada:hoy});
    r.ultimaGen = hoy; cambio = true;
  });
  if(cambio) saveNow();
}
function addRec(){
  const t = document.getElementById('nr-titulo').value.trim();
  if(!t){ toast('Ponele un nombre'); return; }
  const mr = document.getElementById('nr-marca').value.trim();
  S.recurrentes.push({id:uid(), titulo:t,
    tipo: mr ? 'marca' : 'lider',        // sin marca, es una rutina propia
    marca:mr,
    freq:document.getElementById('nr-freq').value,
    dia:document.getElementById('nr-dia').value || 1,
    desc:'', activa:true, ultimaGen:''});
  saveNow(); generarRecurrentes(); render(); toast('Listo, se va a crear sola');
}
function setRec(id,f,v){
  const r = S.recurrentes.find(x=>x.id===id); if(!r) return;
  r[f] = v;
  if(f === 'activa' && v) r.ultimaGen = '';   // al reactivar, que pueda crearse hoy
  saveNow(); generarRecurrentes(); render();
}
function delRec(id){
  const r = S.recurrentes.find(x=>x.id===id);
  if(!r || !confirm('¿Dejar de repetir "'+r.titulo+'"?\n\nLas tareas que ya se crearon quedan como están.')) return;
  S.recurrentes = S.recurrentes.filter(x=>x.id!==id); saveNow(); render();
}

  h += '<div class="add-ini no-print"><div class="add-ini-hdr">Nueva tarea que se repite</div>'+
    '<div class="cfg-add" style="margin-top:0">'+
      '<input class="inp" id="nr-titulo" placeholder="Revisar calendario / envíos" onkeydown="if(event.key===\'Enter\')addRec()">'+
      '<input class="inp" id="nr-marca" list="dl-marcas" style="flex:0 0 170px" placeholder="Marca (opcional)">'+

/* ============================================================
   VISTA — Evolución
   ============================================================ */
function vEvolucion(){
  const N = 12;
  const keys = []; for(let i=N-1;i>=0;i--) keys.push(shiftKey(cur,-i));
  let h = '<div class="section"><div class="section-hdr"><div class="section-title"><span class="dot"></span>Evolución · últimas '+N+' semanas</div>'+
    '<div style="display:flex;gap:6px">'+
      selFiltro('hmView', hmView, [['cuentas','Cuentas'],['niveles','Cuentas por nivel'],['inis','Proyectos y rocks'],['personas','Personas']])+
    '</div></div><div class="twrap">';
  h += '<table class="hm"><thead><tr><th class="name">'+({cuentas:'Cuenta',niveles:'Cuenta / nivel',inis:'Iniciativa',personas:'Persona'})[hmView]+'</th>'+
    keys.map(k=>'<th class="wk'+(k===thisWk()?' now':'')+'">'+wkNum(k)+'</th>').join('')+
    '<th class="wk" style="min-width:60px">Racha</th></tr></thead><tbody>';

  const fila = (nombre, getter, indent) => {
    const r = rachaRojo(getter);
    return '<tr><td class="name"'+(indent?' style="padding-left:30px;font-size:11.5px;color:var(--text2)"':'')+'>'+esc(nombre)+'</td>'+
      keys.map(k=>{ const e = getter(k); return '<td class="hc"><span class="sq '+(e||'')+'" title="Sem '+wkNum(k)+': '+(e||'sin cargar')+'"></span></td>'; }).join('')+
      '<td class="hc" style="text-align:center">'+(r>=2?'<span class="racha">'+r+'w</span>':'<span class="muted">—</span>')+'</td></tr>';
  };
  const grupo = t => '<tr class="grp"><td colspan="'+(keys.length+2)+'">'+t+'</td></tr>';

  if(hmView === 'cuentas'){
    if(!activos(S.cuentas).length) h += '<tr><td colspan="'+(keys.length+2)+'"><div class="empty">Sin cuentas cargadas.</div></td></tr>';
    activos(S.cuentas).forEach(c=> h += fila(c.nombre, k=>ctaGeneral(k,c.id)));
  } else if(hmView === 'niveles'){
    activos(S.cuentas).forEach(c=>{
      h += grupo(esc(c.nombre));
      NIVELES.forEach(n=> h += fila(n.n, k=>rNiv(k,c.id,n.k).estado, true));
    });
  } else if(hmView === 'inis'){
    TIPOS.forEach(t=>{
      const items = activos(S.inis).filter(i=>i.tipo===t.k);
      if(!items.length) return;
      h += grupo(t.n+'s');
      items.forEach(i=> h += fila(i.nombre, k=>rIni(k,i.id).estado, true));
    });
  } else {
    activos(S.personas).forEach(p=>{
      h += fila(p.nombre, k=>rPer(k,p.id).estado);
      activos(p.objetivos).forEach(o=> h += fila(o.nombre, k=>rObj(k,p.id,o.id).estado, true));
    });
  }
  h += '</tbody></table></div></div>';

  const cargadas = Object.keys(S.semanas).filter(hasData).sort();
  h += '<div class="section"><div class="section-hdr"><div class="section-title"><span class="dot"></span>Semanas cargadas</div>'+
    '<span class="hint">'+cargadas.length+' semana'+(cargadas.length===1?'':'s')+'</span></div><div class="section-body">';
  h += cargadas.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap">'+cargadas.reverse().map(k=>
      '<button class="btn-sm" style="'+(k===cur?'border-color:var(--orange);color:var(--orange)':'')+'" onclick="cur=\''+k+'\';openCta=null;render()">'+
      'Sem '+wkNum(k)+' · '+wkLabel(k)+'</button>').join('')+'</div>'
    : '<div class="empty">Todavía no hay semanas con datos.</div>';
  h += '</div></div>';
  return h;
}
