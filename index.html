function mv(arr,i,d){ const j = i+d; if(j<0 || j>=arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; saveNow(); render(); }
function moveIni(i,d){ mv(S.inis,i,d); }
function moveCta(i,d){ mv(S.cuentas,i,d); }
function movePer(i,d){ mv(S.personas,i,d); }

/* ---------- copiar semana anterior ---------- */
function copiarPrev(){
  const p = shiftKey(cur,-1);
  if(!hasData(p)){ toast('La semana anterior está vacía'); return; }
  const pw = S.semanas[p];
  activos(S.inis).forEach(i=>{
    const s = (pw.inis||{})[i.id]; if(!s) return;
    const e = eIni(i.id);
    if(e.estado == null) e.estado = s.estado || null;
    if(!e.avance) e.avance = s.avance || 0;
    if(!e.paso) e.paso = s.paso || '';
  });
  activos(S.cuentas).forEach(c=>{
    const s = (pw.cuentas||{})[c.id]; if(!s) return;
    const t = eCta(c.id);
    NIVELES.forEach(n=>{ const sv = (s.niveles||{})[n.k]; if(sv && t.niveles[n.k].estado == null) t.niveles[n.k].estado = sv.estado || null; });
  });
  activos(S.personas).forEach(pe=>{
    const s = (pw.personas||{})[pe.id]; if(!s) return;
    const t = ePer(pe.id);
    if(t.estado == null) t.estado = s.estado || null;
    activos(pe.objetivos).forEach(o=>{
      const so = (s.objs||{})[o.id]; if(!so) return;
      const to = eObj(pe.id,o.id);
      if(to.estado == null) to.estado = so.estado || null;
      if(!to.avance) to.avance = so.avance || 0;
    });
  });
  (pw.temas||[]).filter(t=>!t.ok).forEach(t=>{
    // se trae el tema y mis notas; lo hablado en la reunión anterior no, es de esa semana
    if(!W(true).temas.some(x=>x.txt === t.txt))
      W(true).temas.push({id:uid(), txt:t.txt, ok:false, nota:t.nota||'', reunion:''});
  });
  saveNow(); render();
  toast('Estados, avances y temas pendientes traídos de la semana anterior');
}

/* ---------- reporte de la semana ---------- */
function verReporte(){
  document.getElementById('rep-sub').textContent = 'Semana '+wkNum(cur)+' · '+wkLabel(cur)+' '+parseISO(cur).getFullYear();
  document.getElementById('rep-body').textContent = buildResumen();
  document.getElementById('modal').classList.add('open');
  document.body.classList.add('rep-open');
}
function cerrarReporte(){
  document.getElementById('modal').classList.remove('open');
  document.body.classList.remove('rep-open');
}
function copiarReporte(){ copiar(buildResumen(), 'Reporte copiado — pegalo en un mail o Slack'); }
function descargarReporte(){
  const blob = new Blob([buildResumen()], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'seguimiento-sem'+wkNum(cur)+'-'+cur+'.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Reporte descargado');
}
const linea = v => toText(v).replace(/\n+/g,' · ');
function buildResumen(){
  const L = [];
  const w = W(false);
  L.push('SEGUIMIENTO SEMANAL — Semana '+wkNum(cur)+' ('+wkLabel(cur)+' '+parseISO(cur).getFullYear()+')');
  L.push('');
  const inis = activos(S.inis).filter(i=>rIni(cur,i.id).estado || rIni(cur,i.id).nota);
  if(inis.length){
    L.push('## PROYECTOS / ROCKS');
    TIPOS.forEach(t=>{
      inis.filter(i=>i.tipo===t.k).forEach(i=>{
        const e = rIni(cur,i.id);
        L.push('- ['+(e.estado||'sin cargar').toUpperCase()+'] '+i.nombre+' — '+(e.avance||0)+'%'+(i.resp?' ('+i.resp+')':''));
        if(toText(i.desc)) L.push('    Qué es: '+linea(i.desc));
        if(toText(e.nota)) L.push('    '+linea(e.nota));
        if(e.paso) L.push('    Próximo paso: '+e.paso);
        if(toText(e.reunion)) L.push('    Hablado en la reunión: '+linea(e.reunion));
      });
    });
    L.push('');
  }
  const ctas = activos(S.cuentas).filter(c=>ctaGeneral(cur,c.id));
  if(ctas.length){
    L.push('## CUENTAS');
    ctas.forEach(c=>{
      L.push('- ['+ctaGeneral(cur,c.id).toUpperCase()+'] '+c.nombre+(c.celula?' ('+c.celula+')':'')+'  |  '+
        NIVELES.map(n=>n.n+': '+(rNiv(cur,c.id,n.k).estado||'—')).join(' · '));
      NIVELES.forEach(n=>{ const nv = rNiv(cur,c.id,n.k); if(toText(nv.nota)) L.push('    '+n.n+': '+linea(nv.nota)); });
      if(toText(rCta(cur,c.id).nota)) L.push('    Nota: '+linea(rCta(cur,c.id).nota));
    });
    L.push('');
  }
  const pers = activos(S.personas).filter(p=>rPer(cur,p.id).estado || rPer(cur,p.id).nota);
  if(pers.length){
    L.push('## PERSONAS');
    pers.forEach(p=>{
      const e = rPer(cur,p.id), av = perAvance(cur,p.id);
      L.push('- ['+(e.estado||'sin cargar').toUpperCase()+'] '+p.nombre+(av!=null?' — objetivos '+av+'%':''));
      if(toText(e.nota)) L.push('    '+linea(e.nota));
      activos(p.objetivos).forEach(o=>{
        const ov = rObj(cur,p.id,o.id);
        if(ov.estado || ov.avance || ov.nota)
          L.push('    · '+o.nombre+': '+(ov.avance||0)+'% ['+(ov.estado||'—')+']'+(ov.nota?' — '+linea(ov.nota):''));
      });
    });
    L.push('');
  }
  const al = alertas();
  if(al.length){ L.push('## ALERTAS'); al.forEach(a=>L.push('- '+a.txt.replace(/<[^>]+>/g,''))); L.push(''); }
  const tem = (w.temas||[]);
  if(tem.length){
    L.push('## TEMAS PARA EL 1:1');
    tem.forEach(t=>{
      L.push('- ['+(t.ok?'x':' ')+'] '+t.txt);
      if(toText(t.nota)) L.push('    Mis notas: '+linea(t.nota));
      if(toText(t.reunion)) L.push('    Hablado: '+linea(t.reunion));
    });
    L.push('');
  }
  if(toText(w.nota)){ L.push('## NOTAS'); L.push(toText(w.nota)); L.push(''); }
  if(toText(w.acuerdos)){ L.push('## ACUERDOS'); L.push(toText(w.acuerdos)); }
  return L.join('\n');
}
function copiar(txt, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>fallbackCopy(txt,msg));
  } else fallbackCopy(txt,msg);
}
function fallbackCopy(txt,msg){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('No se pudo copiar'); }
  document.body.removeChild(ta);
}

/* ============================================================
   Buscador global — atraviesa todas las semanas y solapas
   ============================================================ */
let _resultados = [];
function fragmento(texto, q){
  const t = toText(texto);
  const i = t.toLowerCase().indexOf(q);
  if(i < 0) return esc(t.slice(0,110)) + (t.length>110?'…':'');
  const desde = Math.max(0, i-55), hasta = Math.min(t.length, i+q.length+65);
  return (desde?'…':'') + esc(t.slice(desde,i)) +
    '<mark>' + esc(t.slice(i, i+q.length)) + '</mark>' +
    esc(t.slice(i+q.length, hasta)) + (hasta<t.length?'…':'');
}
function buscar(qRaw){
  const q = (qRaw||'').trim().toLowerCase();
  if(q.length < 2){ toast('Escribí al menos 2 letras'); return; }
  const res = [];
  const pega = (texto, o) => {
    if(!texto) return;
    if(toText(texto).toLowerCase().includes(q)){ o.frag = fragmento(texto, q); res.push(o); }
  };
  const nombreCoincide = n => (n||'').toLowerCase().includes(q);

  // maestros
  S.cuentas.forEach(c=>{
    if(nombreCoincide(c.nombre) || nombreCoincide(c.celula) || nombreCoincide(c.resp))
      res.push({tipo:'Cuenta', titulo:c.nombre, ctx:[c.celula,c.resp].filter(Boolean).join(' · '),
        frag:'Ficha de la cuenta', tab:'cuentas', cta:c.id, orden:0});
  });
  S.inis.forEach(i=>{
    if(nombreCoincide(i.nombre)) res.push({tipo:TIPOS.find(t=>t.k===i.tipo).n, titulo:i.nombre,
      ctx:i.resp||'', frag:toText(i.desc)?fragmento(i.desc,q):'Ficha del ítem', tab:'proyectos', orden:0});
    else pega(i.desc, {tipo:'Descripción', titulo:i.nombre, ctx:'de qué se trata', tab:'proyectos', orden:1});
  });
  S.personas.forEach(p=>{
    if(nombreCoincide(p.nombre)) res.push({tipo:'Persona', titulo:p.nombre, ctx:p.rol||'',
      frag:'Ficha de la persona', tab:'personas', orden:0});
    p.objetivos.forEach(o=>{ if(nombreCoincide(o.nombre) || nombreCoincide(o.meta))
      res.push({tipo:'Objetivo', titulo:o.nombre, ctx:p.nombre, frag:esc(o.meta||''), tab:'personas', orden:1}); });
  });
  (S.tareas||[]).forEach(t=>{
    if(nombreCoincide(t.titulo) || nombreCoincide(t.marca))
      res.push({tipo:'Tarea', titulo:t.titulo, ctx:[t.marca, t.fecha, t.hecha?'hecha':'pendiente'].filter(Boolean).join(' · '),
        frag:toText(t.desc)?fragmento(t.desc,q):'', tab:'tareas', marca:(t.marca||'').trim(), orden:1});
    else pega(t.desc, {tipo:'Tarea', titulo:t.titulo, ctx:t.marca||'', tab:'tareas', marca:(t.marca||'').trim(), orden:2});
  });

  // historial semanal
  Object.keys(S.semanas).sort().reverse().forEach(k=>{
    const w = S.semanas[k], et = 'Sem '+wkNum(k)+' · '+wkLabel(k);
    const base = {semana:k, orden:2};
    pega(w.nota,     Object.assign({tipo:'Nota de la semana', titulo:et, ctx:'', tab:'resumen'}, base));
    pega(w.acuerdos, Object.assign({tipo:'Acuerdos', titulo:et, ctx:'', tab:'resumen'}, base));
    (w.temas||[]).forEach(t=>{
      if(nombreCoincide(t.txt)) res.push(Object.assign({tipo:'Tema del 1:1', titulo:t.txt, ctx:et, frag:'', tab:'resumen'}, base));
      pega(t.nota,    Object.assign({tipo:'Mis notas', titulo:t.txt, ctx:et, tab:'resumen'}, base));
      pega(t.reunion, Object.assign({tipo:'Hablado en el 1:1', titulo:t.txt, ctx:et, tab:'resumen'}, base));
    });
    Object.keys(w.inis||{}).forEach(id=>{
      const i = S.inis.find(x=>x.id===id); if(!i) return;
      const e = w.inis[id];
      pega(e.nota,    Object.assign({tipo:'Estado semanal', titulo:i.nombre, ctx:et, tab:'proyectos'}, base));
      pega(e.reunion, Object.assign({tipo:'Hablado en el 1:1', titulo:i.nombre, ctx:et, tab:'proyectos'}, base));
      pega(e.paso,    Object.assign({tipo:'Próximo paso', titulo:i.nombre, ctx:et, tab:'proyectos'}, base));
    });
    Object.keys(w.cuentas||{}).forEach(id=>{
      const c = S.cuentas.find(x=>x.id===id); if(!c) return;
      const cc = w.cuentas[id];
      pega(cc.nota, Object.assign({tipo:'Nota de cuenta', titulo:c.nombre, ctx:et, tab:'cuentas', cta:id}, base));
      NIVELES.forEach(n=> pega(((cc.niveles||{})[n.k]||{}).nota,
        Object.assign({tipo:n.n, titulo:c.nombre, ctx:et, tab:'cuentas', cta:id}, base)));
    });
    Object.keys(w.personas||{}).forEach(id=>{
      const p = S.personas.find(x=>x.id===id); if(!p) return;
      const pp = w.personas[id];
      pega(pp.nota, Object.assign({tipo:'Cómo viene', titulo:p.nombre, ctx:et, tab:'personas'}, base));
      Object.keys(pp.objs||{}).forEach(oid=>{
        const o = p.objetivos.find(x=>x.id===oid); if(!o) return;
        pega(pp.objs[oid].nota, Object.assign({tipo:'Objetivo', titulo:p.nombre+' · '+o.nombre, ctx:et, tab:'personas'}, base));
      });
    });
  });

  res.sort((a,b)=> (a.orden-b.orden) || String(b.semana||'').localeCompare(String(a.semana||'')));
  _resultados = res.slice(0,60);
  pintarBusqueda(qRaw.trim(), res.length);
}
function pintarBusqueda(q, total){
  document.getElementById('bus-sub').textContent =
    total ? total+' resultado'+(total===1?'':'s')+' para "'+q+'"'+(total>60?' — se muestran los primeros 60':'')
          : 'Sin resultados para "'+q+'"';
  const b = document.getElementById('bus-body');
  b.innerHTML = _resultados.length
    ? _resultados.map((r,i)=>
        '<div class="bus-i" onclick="irAResultado('+i+')">'+
          '<div class="bus-top"><span class="bus-tipo">'+esc(r.tipo)+'</span>'+
          '<span class="bus-tit">'+esc(r.titulo)+'</span>'+
          (r.ctx?'<span class="bus-ctx">'+esc(r.ctx)+'</span>':'')+'</div>'+
          (r.frag?'<div class="bus-frag">'+r.frag+'</div>':'')+
        '</div>').join('')
    : '<div class="empty">No aparece en ninguna semana ni ficha.<br>'+
      '<span style="font-size:11px">Probá con menos letras o con el nombre de la marca.</span></div>';
  document.getElementById('modal-buscar').classList.add('open');
}
function cerrarBuscar(){ document.getElementById('modal-buscar').classList.remove('open'); }
function irAResultado(i){
  const r = _resultados[i]; if(!r) return;
  if(r.semana) cur = r.semana;
  if(r.cta) openCta = r.cta;
  if(r.tab === 'cuentas'){ fCel = 'todas'; fCta = 'todas'; qCta = ''; }
  if(r.tab === 'proyectos') fProy = 'todos';
  if(r.tab === 'tareas'){ fTar = 'todas'; fTarMarca = r.marca || 'todas'; }
  tab = r.tab;
  cerrarBuscar(); render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- respaldo en archivo (opcional, ahora que hay nube) ---------- */
function diasSinRespaldo(){
  if(!S.ultimoBackup) return null;                 // nunca exportó
  return Math.floor((new Date() - parseISO(S.ultimoBackup)) / 86400000);
}
function textoRespaldo(){
  const d = diasSinRespaldo();
  if(d === null) return 'nunca';
  if(d === 0) return 'hoy';
  if(d === 1) return 'ayer';
  if(d < 21) return 'hace '+d+' días';
  const sem = Math.floor(d/7);
  return 'hace '+sem+' semana'+(sem===1?'':'s');
}
/* ---------- export / import ---------- */
function exportJSON(){
  S.ultimoBackup = isoDate(new Date());   // se sella dentro del propio archivo, antes de generarlo
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'seguimiento-'+isoDate(new Date())+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  saveNow(); render();
  toast('Respaldo descargado — quedó registrado');
}
function importFile(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const d = JSON.parse(ev.target.result);
      if(!d || !d.v) throw new Error('formato');
      if(!confirm('Esto reemplaza todos los datos actuales por los del archivo. ¿Seguir?')) return;
      S = d; S.cuentas = S.cuentas||[]; S.personas = S.personas||[]; S.inis = S.inis||[]; S.semanas = S.semanas||{};
      S.tareas = S.tareas||[]; S.recurrentes = S.recurrentes||[];
      S.personas.forEach(p=>p.objetivos = p.objetivos||[]);
      // acabás de importar: existe un archivo de respaldo, no hay que avisar de cero
      if(!S.ultimoBackup) S.ultimoBackup = isoDate(new Date());
      saveNow(); render(); toast('Respaldo importado');
    }catch(e){ toast('Archivo inválido'); }
  };
  r.readAsText(f); input.value = '';
}

/* ---------- toast ---------- */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show'); el.style.pointerEvents = 'none';
  clearTimeout(toast._h); toast._h = setTimeout(()=>el.classList.remove('show'), 2600);
}
let _accionToast = null;
function toastAccion(msg, textoBoton, fn){
  const el = document.getElementById('toast');
  _accionToast = fn;
  el.innerHTML = esc(msg)+'<button class="toast-btn" onclick="ejecutarToast()">'+esc(textoBoton)+'</button>';
  el.classList.add('show'); el.style.pointerEvents = 'auto';
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>{ el.classList.remove('show'); _accionToast = null; }, 6000);
}
function ejecutarToast(){
  const fn = _accionToast; _accionToast = null;
  document.getElementById('toast').classList.remove('show');
  if(fn) fn();
}

/* ---------- atajos ---------- */
document.addEventListener('keydown', e=>{
  const modalAbierto = document.getElementById('modal').classList.contains('open');
  const buscarAbierto = document.getElementById('modal-buscar').classList.contains('open');
  if(e.key === 'Escape'){
    if(buscarAbierto){ cerrarBuscar(); return; }
    if(modalAbierto){ cerrarReporte(); return; }
  }
  if((e.key === 'k' || e.key === 'f') && (e.ctrlKey || e.metaKey)){
    e.preventDefault(); const q = document.getElementById('q-global'); q.focus(); q.select(); return;
  }
  if(modalAbierto || buscarAbierto) return;
  // si estás escribiendo en cualquier campo (incluidos los editores de notas,
  // que son contenteditable y no input), las flechas mueven el cursor, no la semana
  const ae = document.activeElement;
  const editando = el => !!el && (el.isContentEditable || (el.matches && el.matches('input,textarea,select')));
  if(editando(e.target) || editando(ae)) return;
  if(e.key === 'ArrowLeft') navWeek(-1);
  if(e.key === 'ArrowRight') navWeek(1);
});
window.addEventListener('beforeunload', function(e){
  if(_t || sincro === 'va' || sincro === 'mal'){
    guardarLocal(true);                 // queda la copia local aunque no llegue a subir
    e.preventDefault(); e.returnValue = '';
  }
});

/* ============================================================
   Arranque: sesión → datos de la nube → app
   ============================================================ */
function errAuth(msg){ document.getElementById('au-err').textContent = msg || ''; }
function mostrarLogin(){
  document.getElementById('auth').classList.add('on');
  document.getElementById('app-shell').classList.remove('on');
  const m = leerMeta();
  if(m && m.mail) document.getElementById('au-mail').value = m.mail;
  document.getElementById('au-mail').focus();
}
function entrarConClave(){
  const mail = document.getElementById('au-mail').value.trim();
  const pass = document.getElementById('au-pass').value;
  if(!mail || !pass){ errAuth('Completá email y contraseña'); return; }
  errAuth(''); document.getElementById('au-btn').disabled = true;
  sb.auth.signInWithPassword({email:mail, password:pass}).then(function(r){
    document.getElementById('au-btn').disabled = false;
    if(r.error){
      // el mensaje crudo distingue "credenciales inválidas" de un rate limit
      errAuth(r.error.message || 'No se pudo entrar');
      if(/invalid/i.test(r.error.message||'')) errAuth('Email o contraseña incorrectos. Ojo que el dominio es @we-are.com.ar');
      return;
    }
    arrancar();
  });
}
function salir(){
  if(sincro === 'va' || sincro === 'mal'){
    if(!confirm('Hay cambios sin terminar de guardar. ¿Salir igual?')) return;
  }
  sb.auth.signOut().then(()=>location.reload());
}
function arrancar(){
  if(!sb){
    document.getElementById('au-err').textContent =
      'No se pudo cargar la librería de Supabase. Revisá la conexión y recargá.';
    document.getElementById('auth').classList.add('on');
    return;
  }
  sb.auth.getUser().then(function(ru){
    const u = ru.data && ru.data.user;
    if(!u){ mostrarLogin(); return; }
    UID = u.id; MAIL = u.email || '';
    try{ localStorage.setItem(LS_META, JSON.stringify(Object.assign(leerMeta(), {mail:MAIL}))); }catch(e){}
    sb.from('seg_estado').select('datos,version').eq('user_id', UID).maybeSingle().then(function(r){
      if(r.error){
        const faltaTabla = r.error.code === 'PGRST205' || /could not find the table|relation .* does not exist/i.test(r.error.message||'');
        errAuth(faltaTabla
          ? 'Falta crear la tabla en Supabase: corré seguimiento-schema.sql en el SQL editor y volvé a entrar.'
          : 'Entraste, pero no pude leer tus datos: '+r.error.message);
        mostrarLogin();
        return;
      }
      if(!r.data) primeraVez();
      else {
        S = normalizar(r.data.datos); VERSION = r.data.version;
        const meta = leerMeta(), local = leerLocal();
        // había cambios locales sin subir de una sesión anterior
        if(meta.pendiente && local && tieneContenido(local) && meta.version >= VERSION){
          if(confirm('Quedaron cambios en este navegador que nunca llegaron a la nube.\n\n'+
                     'Aceptar: los subo y pisan lo que hay en la nube.\nCancelar: uso lo de la nube y descarto lo local.')){
            S = local; abrirApp(); saveNow(); return;
          }
        }
        abrirApp(); guardarLocal(false);
      }
    });
  });
}
function primeraVez(){
  // no hay fila todavía: si este navegador venía usando la versión local, la subimos
  const local = leerLocal();
  if(tieneContenido(local) &&
     confirm('Es la primera vez que entrás con esta cuenta.\n\n'+
             'Encontré datos guardados en este navegador. ¿Los subo a la nube?\n\n'+
             'Aceptar: los subo y quedan disponibles desde cualquier dispositivo.\n'+
             'Cancelar: arranco vacío (los locales no se borran).')){
    S = local;
  }
  sb.from('seg_estado').insert({user_id:UID, datos:S, version:1}).select('version').then(function(r){
    if(r.error){ alert('No pude crear tu registro en la nube: '+r.error.message); return; }
    VERSION = 1; guardarLocal(false); abrirApp(); marcarSync('ok');
    toast(tieneContenido(S) ? 'Datos subidos a la nube' : 'Listo, ya guarda en la nube');
  });
}
function abrirApp(){
  document.getElementById('auth').classList.remove('on');
  document.getElementById('app-shell').classList.add('on');
  document.getElementById('user-pill').textContent = MAIL;
  marcarSync('ok');
  generarRecurrentes();
  render();
}

sb ? sb.auth.getSession().then(function(r){ r.data.session ? arrancar() : mostrarLogin(); }) : arrancar();
</script>
